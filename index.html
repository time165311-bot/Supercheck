    <style>
      body {
        font-family: 'Sarabun', 'TH Sarabun New', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        word-break: break-word;
      }
    </style>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('anesthesia_theme') || localStorage.getItem('anesthesia_storage_v2_theme_mode');
          var isDark = saved ? saved === 'dark' : true; // Default dark for Gemini aesthetic
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#f8fafc] text-slate-900 dark:bg-[#131314] dark:text-[#e3e3e3] font-sans antialiased min-h-screen selection:bg-[#a8c7fa] selection:text-slate-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
